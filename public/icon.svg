<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c13"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Orbital connector ring representing 10 solutions -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(52, 211, 153, 0.2)" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="rgba(234, 179, 8, 0.25)" stroke-width="2"/>

  <!-- Central Intelligence Core -->
  <g filter="url(#glow)">
    <!-- Central Shield / O shape -->
    <path d="M 256 140 C 320 140 370 190 370 256 C 370 322 320 372 256 372 C 192 372 142 322 142 256 C 142 190 192 140 256 140 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Dynamic Infinity / Neural loop crossing representing Multi-solution integration -->
    <path d="M 200 256 C 200 220 230 200 256 256 C 282 312 312 292 312 256 C 312 220 282 200 256 256 C 230 312 200 292 200 256 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Central spark of intelligence -->
    <circle cx="256" cy="256" r="12" fill="#ffffff" />
  </g>

  <!-- 10 Nodes around the perimeter for the 10 Modules -->
  <!-- 1. Health (0 deg: 256, 116) -->
  <circle cx="256" cy="116" r="10" fill="#34d399"/>
  <!-- 2. Learn (36 deg) -->
  <circle cx="338" cy="143" r="8" fill="#eab308"/>
  <!-- 3. Career (72 deg) -->
  <circle cx="389" cy="213" r="8" fill="#38bdf8"/>
  <!-- 4. Move (108 deg) -->
  <circle cx="389" cy="299" r="8" fill="#a78bfa"/>
  <!-- 5. Shield (144 deg) -->
  <circle cx="338" cy="369" r="10" fill="#f87171"/>
  <!-- 6. Finance (180 deg) -->
  <circle cx="256" cy="396" r="10" fill="#34d399"/>
  <!-- 7. Power (216 deg) -->
  <circle cx="174" cy="369" r="8" fill="#fbbf24"/>
  <!-- 8. Business (252 deg) -->
  <circle cx="123" cy="299" r="8" fill="#38bdf8"/>
  <!-- 9. Waste (288 deg) -->
  <circle cx="123" cy="213" r="8" fill="#4ade80"/>
  <!-- 10. Verify (324 deg) -->
  <circle cx="174" cy="143" r="8" fill="#c084fc"/>
</svg>
